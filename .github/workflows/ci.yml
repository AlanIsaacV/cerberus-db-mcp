name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # deploy/postgres-init/03-wide-schema.sql and deploy/mysql-init/03-wide-schema.sql
      # are output, not source: tools/wide-schema is the single definition of the
      # wide fixture and those files carry a DO NOT EDIT header. Until this step
      # existed nothing gave that header teeth. A hand edit to either file, or a
      # change to the generator whose author forgot to regenerate, left the two
      # disagreeing with no signal — and the disagreement matters, because the
      # integration job feeds the *checked-in* files to the engines, so the tests
      # would be grading a fixture the generator no longer describes. It also gets
      # worse with age: the drift is only discovered when the next person
      # regenerates for an unrelated reason and is handed a 1400-line diff they did
      # not write and cannot review. Failing here puts it on the commit that caused
      # it, while its author can still explain it.
      #
      # This job and not the integration one: the check needs a checkout and a Go
      # toolchain and nothing else. No engine reads these files here. Putting it
      # behind two service containers would make a five-second check wait out a
      # twenty-minute suite.
      #
      # The whole worktree, and deliberately not a list of the generator's output
      # paths. Naming them here would copy the map in tools/wide-schema's main
      # function with nothing keeping the two in agreement — so a third generated
      # file, or a move of either init directory, would fall outside the check
      # while it went on reporting green. That is the same drift this step exists
      # to catch, one level up, and a guard that quietly stops guarding is worse
      # than none because it is trusted. actions/checkout leaves the tree clean and
      # no step above this one writes into it, so anything git reports here was
      # written by the generator just now, wherever it chose to write it.
      #
      # That premise is load-bearing in one direction: this step must stay above
      # every step that can dirty the worktree. The fuzz step below writes failing
      # inputs under internal/gate/testdata/fuzz, and running after it would make
      # a fuzz find look like fixture drift.
      #
      # `git status --porcelain` and not `git diff`, because a diff says nothing
      # about a file the generator started writing that nobody committed — which
      # is why this used to need a second, separate untracked check. The report
      # below still tells the two cases apart: "you hand-edited generated output"
      # and "the generator emits a file you never added" have different fixes.
      - name: wide-schema fixture matches its generator
        run: |
          go run ./tools/wide-schema

          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            if git diff --quiet HEAD; then
              tracked=''
            else
              tracked=yes
            fi
            untracked=$(git ls-files --others --exclude-standard)

            echo "the checked-in fixture DDL is not what tools/wide-schema produces."
            echo "either a generated file was hand-edited, or the generator changed"
            echo "and its output was not regenerated. fix it at the source:"
            echo
            echo "    go run ./tools/wide-schema"
            echo "    git add -- $(printf '%s\n' "$dirty" | cut -c4- | tr '\n' ' ')"
            echo
            echo "git status --porcelain, which is what this step gates on:"
            echo "$dirty"
            echo
            if [ -n "$tracked" ]; then
              echo "what regenerating just now changed in committed files:"
              git --no-pager diff --stat HEAD
              echo
            fi
            if [ -n "$untracked" ]; then
              echo "files the generator wrote that are not committed at all. no"
              echo "diff can show these; they need git add:"
              echo "$untracked"
              echo
            fi
            if [ -n "$tracked" ]; then
              echo "first 200 lines of the difference (it is generated DDL; the"
              echo "command above is the fix, not editing these lines):"
              git --no-pager diff HEAD | head -n 200
            fi
            exit 1
          fi

      # The gate's safety argument is that its verdict depends on nothing but
      # its input. This is the whole-closure half of that check; the per-file
      # half is TestPackageImportsNothingItShouldNot.
      - name: gate dependency closure
        run: |
          deps=$(go list -deps ./internal/gate | grep -v '^github.com/AlanIsaacV/cerberus-db-mcp')
          if echo "$deps" | grep -Eq '(^|/)net($|/)|database/sql|sql/driver|modelcontextprotocol|crypto/tls|os/exec'; then
            echo "the gate's dependency closure contains a forbidden package:"
            echo "$deps"
            exit 1
          fi
          if echo "$deps" | grep -qv '^[a-z]'; then
            echo "the gate's dependency closure contains a non-standard-library package:"
            echo "$deps" | grep -v '^[a-z]'
            exit 1
          fi

      # internal/db gets the same whole-closure treatment for one of the gate's
      # rules only. It legitimately depends on sockets, TLS and three drivers, so
      # the enumerated list above is its per-file check in
      # internal/db/deps_test.go and not this. What must hold here is that no
      # transport ever reaches it: a db that knew what MCP was could not be run
      # against a real engine by `go test` alone, and the layer where the gate,
      # the row cap and the rolled-back transaction are enforced would stop being
      # testable without the layer that exposes it.
      - name: db dependency closure
        run: |
          deps=$(go list -deps ./internal/db | grep -v '^github.com/AlanIsaacV/cerberus-db-mcp')
          if echo "$deps" | grep -q 'modelcontextprotocol'; then
            echo "internal/db's dependency closure contains the MCP SDK:"
            echo "$deps" | grep 'modelcontextprotocol'
            exit 1
          fi

      # The deployment target is a Raspberry Pi 4B, and the binary that reaches it
      # is a single static file. CGO_ENABLED=0 is the half of that which a
      # dependency can break silently — one cgo edge anywhere in the closure and
      # this stops compiling — so it is checked on every change rather than
      # discovered at release. The whole repository is built, not just cmd/, so a
      # package that is only reachable from a test is covered too.
      - name: cross-compile static linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build ./...

      # The corpus is the safety evidence, so the fuzzer runs on every change
      # rather than only when someone remembers to.
      - name: go test -fuzz
        run: go test -run Fuzz -fuzz FuzzGate -fuzztime 60s ./internal/gate

      # A fuzz failure writes the input that caused it under testdata/fuzz.
      # Uploading it makes the find a file someone can commit as a permanent
      # seed, rather than a string to retype out of a log.
      - name: upload the failing fuzz input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: internal/gate/testdata/fuzz
          if-no-files-found: ignore

  # A second job, not a step in the first one. The container-backed tests need
  # engines running, and folding them into the unit job would make every check in
  # it — gofmt, vet, the gate's dependency closure — depend on a database coming
  # up. `go test ./...` with no build tag must keep passing with nothing running,
  # and that is what the job above proves.
  #
  # There is no SQL Server service. No arm64 image of it exists and the only
  # arm64-native alternative is a retired 2019-vintage engine, so SQL Server is
  # verified against a real instance reached over a VPN, which no runner has. Those
  # tests take their connection from the per-alias environment variables and skip
  # with a clear message when they are not set — which is what happens here.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # deploy/compose.test.yaml runs this engine with max_connections=50, so
        # that the tests which watch a running query from a second connection have
        # room beyond the executor's own pool. That is a server command flag, and a
        # service container takes no command — but the image's own default is 100,
        # which is above it, so the headroom is there and the flag is deliberately
        # not reproduced. Nothing asserts a ceiling on connections; if something
        # ever does, it needs a compose-backed engine rather than this one.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cerberus-test-pg-root
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cerberus-test-my-root
          MYSQL_USER: cerberus
          MYSQL_PASSWORD: cerberus-test-my
          # Named so that it is not the username and does not contain it. The
          # sanitisation criterion names the database and the user as separate
          # things that must not reach the agent, and a fixture that spells them
          # the same way makes the two checks one check under two labels: a leak
          # of either fails, and neither the test nor the person reading it can
          # say which leaked.
          MYSQL_DATABASE: testbed
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucerberus -pcerberus-test-my --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      # Every skip in the integration suite is individually right, and together
      # they mean a typo in one of the variable names below would give this job
      # exit 0 with nothing asserted — indistinguishable from the SQL Server tests
      # skipping, which they legitimately do. Naming the two engines this job has
      # containers for turns that silence into a failure. SQL Server is
      # deliberately absent: no instance is reachable from a runner.
      CERBERUS_TEST_REQUIRE_ENGINES: postgresql,mysql
      CERBERUS_DB_ALIASES: pgtest,mytest
      CERBERUS_DB_PGTEST_ENGINE: postgresql
      CERBERUS_DB_PGTEST_HOST: 127.0.0.1
      CERBERUS_DB_PGTEST_PORT: '55432'
      # The database name and the user name are deliberately unalike, and neither
      # is a substring of the other. See MYSQL_DATABASE above for why.
      #
      # One name and not both the fixture creates. An alias that lists databases is
      # replaced by one connection per database named <alias>.<database>, so this is
      # the connection pgtest.testbed and nothing is reachable under the bare name
      # pgtest. ledger is deliberately left off: the tests that are about a set of
      # databases build their own alias over both names from this one's topology, and
      # the discovery tests need ledger to exist rather than to be connected to.
      CERBERUS_DB_PGTEST_DATABASES: testbed
      CERBERUS_DB_PGTEST_USER: cerberus
      CERBERUS_DB_PGTEST_PASSWORD: cerberus-test-pg
      CERBERUS_DB_PGTEST_TLS: disable
      CERBERUS_DB_MYTEST_ENGINE: mysql
      CERBERUS_DB_MYTEST_HOST: 127.0.0.1
      CERBERUS_DB_MYTEST_PORT: '53306'
      # Set even though MySQL accepts an alias with no databases at all, because an
      # alias without one has an empty database name and the sanitisation tests
      # check the database name and the user name as substrings: the empty string is
      # a substring of every user name, so the guard that keeps the two values
      # distinguishable would fail on it rather than on a leak. The engine's
      # acceptance of the absent variable is established by a test that builds its
      # own alias for it, not by this job's configuration.
      CERBERUS_DB_MYTEST_DATABASES: testbed
      CERBERUS_DB_MYTEST_USER: cerberus
      CERBERUS_DB_MYTEST_PASSWORD: cerberus-test-my
      CERBERUS_DB_MYTEST_TLS: disable
      CERBERUS_DB_ROW_CAP: '50'
      CERBERUS_DB_QUERY_TIMEOUT: 4s
      CERBERUS_DB_TIMEOUT_GRACE: 4s
      CERBERUS_DB_LOCK_TIMEOUT: 2s
      CERBERUS_DB_CONNECT_TIMEOUT: 10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # A service container starts before the checkout and cannot mount a repository
      # file, so the files deploy/compose.test.yaml hands to the entrypoints are fed
      # to the engines from the runner instead — the same files, in the same lexical
      # order, through the same client, against the same default database each
      # entrypoint would use: postgres for psql, because the image falls back to
      # POSTGRES_USER when POSTGRES_DB is unset, and testbed for mysql, because that
      # is MYSQL_DATABASE. They are the fixture's only definition, so CI and
      # `docker compose -f deploy/compose.test.yaml up` cannot come to disagree
      # about what a test is running against; each file says why its own statements
      # are there.
      #
      # Mounting them would not be enough even if a service container could, for a
      # reason worth knowing before trying: both images run
      # /docker-entrypoint-initdb.d only while initialising an empty data
      # directory, so a cached volume comes up healthy and missing whatever a script
      # gained since. Replaying them unconditionally is what makes the fixture
      # depend on the workflow rather than on the runner's disk.
      - name: prepare the engines
        env:
          PGPASSWORD: cerberus-test-pg-root
        run: |
          for script in deploy/postgres-init/*.sql; do
            psql -h 127.0.0.1 -p 55432 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 --no-psqlrc -f "$script"
          done

          # The one piece of the compose fixture that is not an init script, and so
          # the one piece that is still written out here: general_log is a server
          # command flag there, and a service container takes no command.
          mysql -h 127.0.0.1 -P 53306 --protocol=TCP -uroot -pcerberus-test-my-root \
            -e "SET GLOBAL log_output = 'TABLE'; SET GLOBAL general_log = 1;"

          for script in deploy/mysql-init/*.sql; do
            mysql -h 127.0.0.1 -P 53306 --protocol=TCP -uroot -pcerberus-test-my-root \
              --database=testbed < "$script"
          done

      # The whole repository, not an enumerated list of the packages that have
      # container-backed tests today. The list is what went wrong once already:
      # it read ./internal/db/... and internal/mcp's integration tests — the only
      # evidence for five of that objective's acceptance criteria — were never
      # run by anything. A package whose tests need an engine now joins this job
      # by existing rather than by somebody remembering this line.
      #
      # It does not weaken the argument the job comment above makes. That
      # argument is about the *untagged* job: `go test ./...` with no build tag
      # must pass with nothing running, and it is the job above, without
      # services, that proves it. Running the same package set here with the tag
      # and the engines up adds coverage; it takes none away.
      #
      # -p 1 is what the widening cost. `go test` runs one package binary per
      # available core, and until this line said ./... there was only ever one
      # binary here. Now there are two, they share one postgres and one mysql
      # container on a two-core runner, and they want opposite things from it:
      # internal/mcp provokes its timeout class with reads chosen to be
      # expensive — a 200000 x 200000 cross join on postgres, a triple self-join
      # of information_schema.columns on mysql — while internal/db asserts that a
      # cancelled query stops strictly before QueryTimeout + TimeoutGrace, which
      # is 8s with the variables above. Run together, internal/mcp's load is
      # inside internal/db's bound, and the result is a red run that reproduces
      # nowhere. Deleting -p 1 makes this job faster and makes those assertions
      # flaky; the two are the same change.
      - name: go test -tags integration
        run: go test -tags integration -race -timeout 20m -p 1 ./...

      # The schema surface is graded on byte ceilings, and each ceiling is only
      # half of what is required: the measured worst cases have to be readable by
      # a person, so that the figures this project quotes for one call are
      # measurements rather than derivations from the row cap. The step above
      # asserts them and cannot report them — `go test` discards a passing test's
      # log output unless -v is given, and putting -v on a twenty-minute suite
      # buries the lines they are for. So those two tests run again, verbosely,
      # and their measurements go to the job summary where nobody has to open a
      # log. They re-run in seconds against the engines that are already up.
      #
      # It is deliberately not run when the step above failed. Go prints a failed
      # test's log output whatever the flags, so a run that breached the ceiling
      # already carries the number that breached it.
      #
      # -count=1 because the flags a run is cached under include -run and -v: two
      # invocations that differ only in those can otherwise be answered from the
      # cache, and a cached run prints no log output at all.
      #
      # `set -euo pipefail` is declared in the body, and this step carries no
      # `shell:` key. GitHub resolves an explicit `shell: bash` to
      # `bash --noprofile --norc -eo pipefail {0}` and a step without one to
      # `bash -e {0}`, and until the line below was written that key — then the
      # only `shell:` in this file — was the whole of what kept `go test`'s exit
      # status from being replaced by `tee`'s, which is always 0. A refactor that
      # dropped one line nothing commented on would have turned a breached byte
      # ceiling into a green step, with no test and no linter here to notice. The
      # guarantee belongs inside the thing it guards, so the key is gone rather
      # than left beside a body that no longer needs it: two reporting steps
      # spelling one guarantee two ways is how the next person learns the wrong
      # convention.
      - name: report the schema-surface worst cases
        run: |
          set -euo pipefail
          go test -tags integration -count=1 -timeout 5m \
            -run '^(TestSearchSchemaWireSizeStaysUnderItsBounds|TestDescribeTableWireSizeStaysUnderItsBounds)$' -v ./internal/mcp/ \
            | tee "$RUNNER_TEMP/schema-surface-size.log"
          {
            echo '### schema-surface result sizes'
            echo
            echo '```'
            grep -E 'search_schema wire size|describe_table wire size' "$RUNNER_TEMP/schema-surface-size.log" \
              || echo 'the measurement did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every other figure this job reports is one tool's worst case. This one is
      # the sum of the four calls an agent actually makes to get from an
      # approximate table name to rows — list_databases, search_schema,
      # describe_table, execute_query — because the promise being kept is about
      # that whole path through a large schema and not about any single call on
      # it. Until this ran in CI the only sequence figure this project had came
      # from a SQL Server instance reachable over a VPN, recorded in a transcript;
      # here it is measured on both engines that have containers, on every push.
      #
      # Its own step and not another name in the -run alternation above. Both
      # steps abort before writing their summary when their `go test` fails, so
      # folded into one the sequence figure would be lost to a per-tool ceiling
      # breach and the per-tool figures to a sequence breach — and a run where one
      # measurement broke is exactly the run where the other one is worth reading.
      #
      # Nothing here touches CERBERUS_DB_ROW_CAP, although this job sets it to 50
      # and a byte budget measured under a cap of 50 measures the cap. The test
      # raises it to the shipped default itself, through the same shippedRowCap
      # helper the describe_table wire test uses; setting it on this step would
      # apply to everything the step runs and would make the published figure a
      # property of this workflow rather than of what a deployment that configures
      # nothing runs under.
      #
      # No `shell:` key, as on the reporting step above: the `set -euo pipefail` in
      # the body is the whole of what keeps `tee` from swallowing a failed
      # `go test`, and this step is written so that nothing outside it has to be
      # right.
      #
      # The grep matches measurement wording and nothing else. It used to match
      # `=== RUN` too, for attribution — the test runs once per engine and the
      # summary is unreadable if the figures cannot be told apart — but `=== RUN` is
      # emitted by any `go test -v` at all, so the `|| echo` beside it could never
      # fire: a run that reached no engine, or a t.Logf whose wording drifted, filled
      # the summary with subtest headers and no byte figure and left the step green.
      # Attribution belongs in the log lines instead, which name their engine; this
      # grep is coupled to that wording by string agreement and by nothing else, so
      # a line here that stops matching is a summary that reports the fallback while
      # the measurement passes, and not a failure anything else will catch.
      - name: report the agent sequence cost
        run: |
          set -euo pipefail
          go test -tags integration -count=1 -timeout 5m \
            -run '^TestAgentSequenceCostOnTheWire$' -v ./internal/mcp/ \
            | tee "$RUNNER_TEMP/agent-sequence-size.log"
          {
            echo '### agent sequence cost on the wire'
            echo
            echo '```'
            grep -E 'agent sequence|wire size' "$RUNNER_TEMP/agent-sequence-size.log" \
              || echo 'the measurement did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
