# Engines for the integration tests. Not a deployment: nothing here is the
# application, and the ports are non-default so that a running container cannot
# be confused with a real database on the same machine.
#
#   docker compose -f deploy/compose.test.yaml up -d
#   go test -tags integration ./internal/db/...
#
# There is no SQL Server service, and that is a decision rather than an omission.
# There is no arm64 manifest for mcr.microsoft.com/mssql/server at any tag, and
# the only arm64-native alternative — Azure SQL Edge — is retired, frozen on a
# 2019-vintage engine and no longer publishes an arm64 build at all. Testing the
# engine that matters most against a 2019 engine under emulation would produce
# evidence about the wrong server. The SQL Server tests therefore take their
# connection from the per-alias environment variables and skip cleanly when those
# are not set.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # The bootstrap superuser. The account the tests use is created by
      # postgres-init, deliberately without superuser.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cerberus-test-pg-root
    ports:
      - "55432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # The tests read pg_stat_activity from a second connection while a query is
    # still running, so the pool needs room for more than the executor's own.
    command:
      - postgres
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cerberus-test-my-root
      MYSQL_USER: cerberus
      MYSQL_PASSWORD: cerberus-test-my
      # Not the username, and not a string containing it. The sanitisation tests
      # check the database name and the user name as separate values that must
      # never reach the agent; spelling them the same way would collapse the two
      # checks into one and leave the suite unable to say which of them leaked.
      # postgres-init makes the same choice for the same reason.
      MYSQL_DATABASE: testbed
    ports:
      - "53306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # general_log with TABLE output is what makes the byte-identity assertion
    # possible: it records the statement the server actually received, which is
    # the only witness that is not our own process reporting on itself.
    command:
      - --general-log=1
      - --log-output=TABLE
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucerberus -pcerberus-test-my --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
